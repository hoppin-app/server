version: 1

# To run the complete pipeline on ft/* pushes, uncomment:
# feature_branches:
#   full: true

python:
  enable: true
  versions: ["3.12", "3.13"]
  env:
    HOPPIN_ENV: dev
  lint:
    # Pre-existing findings, ignored so the gate starts green. Burn this list
    # down one rule at a time; never add to it.
    extend_ignore:
      [B017, B904, E501, E741, F401, F841, I001, PLC0415, PLR0912, PLR0913, PLR0915,
       PLR0917, PLW0603, PLW1510, PLW2901, RUF001, RUF005, RUF012, RUF023, RUF100,
       SIM102, SIM105, SIM110, SIM117, UP006, UP012, UP015, UP017, UP031, UP035,
       UP041, UP045]
  format:
    enable: false # 5 files are not ruff-formatted yet; enable after one `ruff format`
  test:
    runner: unittest
    tests_dir: tests
    coverage_min: 75 # measured 79%; only ever raise this

security:
  codeql:
    enable: true
    languages: [python]
  sast:
    fail_on_findings: false # 3 findings to triage (credential logging, dynamic urllib); then remove
