name: Pipeline

# Each job runs a script in .github/workflows/scripts, to keep logic out of
# the YAML. Ported from the single-repo pipeline (Guilherme Wind).
#
# Stages:
#   1. Quality: lint, protocol vectors, secrets
#   2. Build: server tests + dependency audit
#   3. Gate: unified status

on:
  push:
    branches: [main, development, "ft/**"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The lib repo branch that matches this run: the PR's target, else main for
  # main, else development.
  LIB_REF: ${{ github.base_ref || (github.ref_name == 'main' && 'main') || 'development' }}

jobs:
  # --- STAGE 1: QUALITY ---
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Python lint
        run: .github/workflows/scripts/server.sh lint

  protocol:
    name: Protocol Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hoppin-app/lib
          ref: ${{ env.LIB_REF }}
          path: lib
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: .github/workflows/scripts/protocol.sh verify

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/workflows/scripts/secrets.sh scan

  # --- STAGE 2: BUILD ---
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hoppin-app/lib
          ref: ${{ env.LIB_REF }}
          path: lib
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt coverage pip-audit
      - name: Unit tests
        run: .github/workflows/scripts/server.sh test
      - name: Dependency audit
        run: .github/workflows/scripts/server.sh audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: build/ci
          if-no-files-found: ignore

  # --- GATE: unified status ---
  gate:
    name: Pipeline Status
    if: always()
    needs: [lint, protocol, secrets, server-test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Pipeline failed"
            exit 1
          fi
          echo "Pipeline passed"
